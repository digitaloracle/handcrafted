name: Update Hand Crafted Badge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: badge-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test

  update-badge:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Badge
        uses: ./
        with:
          auto-commit: "true"
          commit-limit: "500"
